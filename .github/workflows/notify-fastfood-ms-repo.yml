name: Notify Fastfood

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notificar repositório principal
        env:
          GH_TOKEN: ${{ secrets.PARENT_REPO_TOKEN }}
        run: |
          gh api \
            --method POST \
            repos/isaacsilvatech/fastfood/dispatches \
            -f event_type=submodule_updated \
            -f 'client_payload[submodule]=pedidos-ms'